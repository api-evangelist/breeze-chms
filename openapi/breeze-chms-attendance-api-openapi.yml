openapi: 3.2.0
info:
  title: Breeze ChMS Attendance API
  description: The Breeze ChMS API is a documented REST API for Breeze church management software.
  version: '1.0'
  contact:
    name: Breeze ChMS
    url: https://www.breezechms.com
servers:
- url: https://{subdomain}.breezechms.com/api
  description: Church-specific Breeze subdomain
  variables:
    subdomain:
      default: yourchurch
      description: Your church's Breeze subdomain.
security:
- apiKeyAuth: []
tags:
- name: Attendance
  description: Check-in / check-out attendance and eligibility.
paths:
  /events/attendance/add:
    get:
      operationId: addAttendance
      tags:
      - Attendance
      summary: Add attendance (check in / out)
      parameters:
      - name: person_id
        in: query
        schema:
          type: string
      - name: instance_id
        in: query
        schema:
          type: string
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - in
          - out
      responses:
        '200':
          description: Result.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/attendance/delete:
    get:
      operationId: deleteAttendance
      tags:
      - Attendance
      summary: Delete attendance
      parameters:
      - name: person_id
        in: query
        schema:
          type: string
      - name: instance_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Result.
  /events/attendance/list:
    get:
      operationId: listAttendance
      tags:
      - Attendance
      summary: List attendance for an event
      parameters:
      - name: instance_id
        in: query
        required: true
        schema:
          type: string
      - name: details
        in: query
        schema:
          type: boolean
      - name: type
        in: query
        schema:
          type: string
          enum:
          - person
          - anonymous
      responses:
        '200':
          description: A list of attendance records.
  /events/attendance/eligible:
    get:
      operationId: listEligible
      tags:
      - Attendance
      summary: List people eligible to check in
      parameters:
      - name: instance_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of eligible people.
components:
  responses:
    Unauthorized:
      description: Missing or invalid Api-Key header.
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
      description: Account API key sent in the Api-Key header. The Account Owner generates it under Manage Account > API Key in the Breeze web app.
