openapi: 3.2.0
info:
  title: Breeze ChMS Pledges API
  description: The Breeze ChMS API is a documented REST API for Breeze church management software.
  version: '1.0'
  contact:
    name: Breeze ChMS
    url: https://www.breezechms.com
servers:
- url: https://{subdomain}.breezechms.com/api
  description: Church-specific Breeze subdomain
  variables:
    subdomain:
      default: yourchurch
      description: Your church's Breeze subdomain.
security:
- apiKeyAuth: []
tags:
- name: Pledges
  description: Pledge campaigns and pledges.
paths:
  /pledges/list_campaigns:
    get:
      operationId: listCampaigns
      tags:
      - Pledges
      summary: List pledge campaigns
      responses:
        '200':
          description: A list of pledge campaigns.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /pledges/list_pledges:
    get:
      operationId: listPledges
      tags:
      - Pledges
      summary: List pledges in a campaign
      parameters:
      - name: campaign_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of pledges.
components:
  responses:
    Unauthorized:
      description: Missing or invalid Api-Key header.
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
      description: Account API key sent in the Api-Key header. The Account Owner generates it under Manage Account > API Key in the Breeze web app.
